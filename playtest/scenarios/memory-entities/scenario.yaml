# - m-aaa003 (convention, project): superseded by m-aaa001, shown only
#   under state=invalid or all.
# Entities (phase 4, factory/shared-memory-phase-4-entities-and-who-knows-what):
# - m-aaa004 (who, project): @lead-acme knows #playtest and #chrome.
# - m-aaa005 (convention, project): tagged playtest and @owner.
# No machine memories: the runner's HOME keeps the machine store empty.
