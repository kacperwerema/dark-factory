statuses:
  - name: "backlog"
    description: "Ready to start"
  - name: "in progress"
    description: "Being built"
  - name: "testing"
    description: "Being checked"
  - name: "human-testing"
    description: "The owner checks it"
  - name: "done"
    description: "Finished"

transitions:
  - from: "backlog"
    to: "in progress"
  - from: "in progress"
    to: "testing"
  - from: "testing"
    to: "human-testing"
  - from: "human-testing"
    to: "done"
    actions:
      - type: "require_human_approval"
        status: "done"
