# The departments health family. Marketing (system SEO) has two manual
# goals, a daily job and an open handoff from HQ created 2026-10-01 (older
# than handoff_age_days); Sales has nothing to measure. One fixture snapshot
# from 2026-10-01 holds Marketing's goal progress then (pages 10, posts 80),
# so after `goal set marketing/pages 30` (75%) and `goal set marketing/posts 5`
# (50%) one goal of two moved: goals moving 50%. The daily job is due today
# at 00:00 and never more than a day late, so jobs on time is 100% and
# Marketing is 75% on track whatever the date. Sessions add one output
# (waiting) and take a snapshot with `cli: [health, snapshot]`.
title: Marketing and Sales with goals, a job, an output and a handoff to measure
project:
  name: Acme
  slug: acme
  extra: |
    departments:
      - name: Marketing
        color: "#E2559B"
        role: SEO and content
        systems: [SEO]
        goals:
          - {id: pages, name: Pages refreshed, target: 40}
          - {id: posts, name: Posts, target: 10}
        jobs:
          - {id: daily-check, name: Daily check, every: day, brief: briefs/daily.md}
      - name: Sales
        color: "#17A2B8"
        role: Leads and deals
issues: tracker
workflow: workflow.yaml
root: files
