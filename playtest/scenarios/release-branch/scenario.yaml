# A release branch with candidate tags (workbench.release_candidates):
# milestone 1.5 is cut on release/v1.5 (worktree .worktrees/release-v1.5),
# made from main before the route export fix. The fix landed on main and its
# work branch; it was picked onto the release branch (same patch, so git
# cherry counts it as picked) and v1.5.0-rc.1 tags that pick, a commit main
# lacks. A changelog commit follows on the branch and v1.5.0-rc.2 tags it.
# work/ui/dark-map-style is done but not picked, so the Fixes picked check
# names it. Nothing records a release check, so the candidate is not
# validated. A last main commit (offline tiles, no Refs: line) is on no
# branch: the card lists it with its pick command.
title: Release branch release/v1.5 with rc.1 on a picked fix and rc.2 on its tip
project:
  name: Atlas
  slug: atlas
issues: tracker
workflow: workflow.yaml
root: root
commits:
  - files: commits/fix
    message: "Fix route export"
  - files: commits/changelog
    message: "Changelog: route export fix"
  # A follow-up with no Refs: line: release pick <slug> never finds it, so
  # the card lists it under "Not on release/v1.5, no Refs: line".
  - files: commits/tiles
    message: "Offline tiles cache by zoom level"
branches:
  - name: work/cli/route-export-drops-waypoints
    from: main~3
    commits:
      - files: commits/fix
        message: "Fix route export"
  - name: work/ui/dark-map-style
    from: main~3
    commits:
      - files: branches/dark
        message: "Dark map style follows the system theme"
  - name: release/v1.5
    from: main~3
    worktree: true
    commits:
      - files: commits/fix
        message: "Fix route export (picked)"
      - files: commits/changelog
        message: "Changelog: route export fix"
    tags:
      - name: v1.5.0-rc.1
        ref: release/v1.5~1
      - name: v1.5.0-rc.2
