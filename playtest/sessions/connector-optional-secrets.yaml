session: connector-optional-secrets
issue: factory/connector-secrets-can-be-optional-so-a-department-runs-with-only-the-keys-that-are-set
title: Optional connector secrets - the room reads "not set (optional)", not missing
scenario: connectors

session_checks:
  viewports: [1440x900, 390x844]
  layout: [inside_viewport, no_clipping, no_overlap, no_zero_size_text, styles_applied]
  console: no_errors

steps:
  - id: TP2
    title: An optional secret nobody set reads "not set (optional)" and doesn't count as failing
    setup:
      - open: /p/acme/company?classic=1
      - click: company.room.connectors
    checks:
      - visible: [company.room.connectors, company.room.connectors.failing]
      - text_contains: { target: company.room.connectors, text: "GA_KEY env:PLAYTEST_GA_KEY_NEVER_SET not set (optional)" }
      - text_contains: { target: company.room.connectors.failing, text: "1 failing" }
      - http:
          path: /p/acme/connectors.json?dept=marketing
          status: 200
          body_contains: '"optional":true'
