      - size: { target: hq_report.expand, min_height: 44 }
      - size: { target: hq_report.md, min_height: 44 }
      - size: { target: hq_report.headline.marketing, min_height: 44 }

  - id: TP6
    title: The company page header at 390px fits the screen; its links are 44px tall
    proves: [AC1, AC2]
    setup:
      - open: /p/{project}/company?classic=1
    checks:
      - visible: [map.brand, map.owner, company.room.hq]
      - size: { target: map.brand, min_height: 44 }
      - size: { target: map.owner, min_height: 44 }
      - size: { target: map.waiting, min_height: 44 }
