session: department-goals
issue: factory/department-role-and-goals
title: Department role and goals - HQ goals in the header, the roll-up in HQ, goals in the rooms, goal set
scenario: departments

session_checks:
  viewports: [1440x900]
  layout: [inside_viewport, no_clipping, no_overlap, no_zero_size_text, styles_applied]
  console: no_errors

steps:
  - id: TP4
    title: The company page shows HQ's goals, the roll-up in HQ, and each room's mission and goals
    proves: [AC8]
    setup:
      - cli: [goal, set, marketing/posts, "5"]
      - cli: [goal, set, product/bugs, "10"]
      - cli: [goal, set, hq/revenue, "400", --date, "2020-01-15"]
      - open: /p/acme/company?classic=1
    checks:
      # The header's first goal is HQ's clients: no value of its own, so the
      # mean of Pages refreshed (30/40 = 75%) and Posts (5/10 = 50%).
      - text_contains: { target: company.goal, text: "Paying clients" }
      - text_contains: { target: company.goal, text: "63%" }
      - text_contains: { target: company.hq.rollup, text: "Marketing · Pages refreshed" }
      - text_contains: { target: company.hq.rollup, text: "Marketing · Posts" }
      - text_contains: { target: company.hq.rollup, text: "400 EUR / 1000 EUR" }
      - count: { pattern: company.hq.rollup.child, equals: 2 }
      - text_contains: { target: company.room.dept, text: "Every client site refreshed every week" }
      - text_contains: { target: company.room.dept, text: "30 / 40" }
      - text_contains: { target: company.room.product, text: "Ship the engine" }
      - text_contains: { target: company.room.product, text: "10 / 5" }
      - below: [company.ceo.quote, company.hq.rollup]
      - beside: [company.room.hq, company.room.product]
    do: Look at the header, the HQ room and the Marketing room.
    expect: >-
      The header shows two goal chips (Paying clients 63%, Revenue 400 EUR / 1000 EUR), with Revenue faded
      because its value is from January 2020. Under the CEO's desk, HQ shows its mission and each business
      goal with the department goals feeding it, indented in Marketing's pink. The Marketing room and the
      Product line show their mission in italics and their goals as small bars. Nothing is cut off or
      overlapping, and the goal names read without hovering.
    why: The owner reads the business goals and which department moves them at a glance; the chips reuse the header's goal component.

  - id: TP5
    title: A value recorded with goal set shows after a reload and replaces the rolled-up mean
    proves: [AC2, AC5]
    setup:
      - cli: [goal, set, marketing/posts, "5"]
      - open: /p/acme/company?classic=1
      - check: { text_contains: { target: company.goal, text: "63%" } }
    act:
      - cli: [goal, set, hq/clients, "12", --note, "two signed this week"]
      - reload: true
      - wait_for: company.goal
    checks:
      - text_contains: { target: company.goal, text: "12 / 20" }
      - cli: { args: [goals, hq], contains: "Paying clients [hq/clients]  12 / 20 · 60%" }

  - id: TP6
    title: issue-cli goals, department show and show print the roll-up, the role prompt and the Department line
    proves: [AC6, AC7, AC9]
    setup:
      - open: /p/acme/company?classic=1
    checks:
      - cli: { args: [goals], contains: "↳ Marketing: Pages refreshed [marketing/pages]  30 / 40 · 75%" }
      - cli: { args: [goals], contains: "no value yet: issue-cli goal set marketing/posts <value>" }
      - cli: { args: [department, show, marketing], contains: "You are the Marketing lead." }
      - cli: { args: [show, seo/weekly-seo-pass], contains: "Department: Marketing (Every client site refreshed every week) — role: departments/marketing.md · goals: issue-cli goals marketing" }
      - cli: { args: [health, lint, --check, departments], contains: "✓ no warnings" }
