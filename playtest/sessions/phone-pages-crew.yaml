session: phone-pages-crew
issue: ui/phone-view-works-on-every-workshop-board-page-no-sideways-scroll-16px-gutters-big-tap-targets-tables-as-rows
title: "The Crew pages at phone width"
scenario: leads

# 390x844 only. inside_viewport fails when documentElement.scrollWidth is
# wider than the screen (the sideways-scroll check), naming the outermost
# element that sticks out.
session_checks:
  viewports: [390x844]
  layout: [inside_viewport, no_zero_size_text, styles_applied]
  console: no_errors

steps:
  - id: TP12
    title: At 390px /crew and the project's Crew fit the screen
    proves: [AC1, AC2]
    setup:
      - tmux: [new-session, -d, -s, agent-ui-child, cat, -]
      - open: /crew
    act:
      - check: { visible: [crew_all.page, crew_all.row.agent-ui-child] }
      - open: /p/{project}/agents
    checks:
      - visible: [map.waiting]
