board:
  columns:
    - idea
    - in design
    - backlog
    - in progress
    - testing
    - human-testing
    - documentation
    - shipping
    - done
    - parked
  card_fields:
    - system
    - labels
    - priority
    - assignee

statuses:
  - name: "idea"
    description: "Raw idea, needs exploration"
    prompt: |
      Read the brief and the context before moving into structured design.
      Collect the questions about goals, scope and success criteria for the design's clarify round (`## Clarify`), all at once, instead of one at a time.
  - name: "in design"
    role: "design"
    description: "Being designed and specced out"
    prompt: |
      Review the relevant context before proposing changes.
      Turn the problem into explicit checklists, assumptions, and open questions.
      Write the clarify round once, in a `## Clarify` section: every question at once, each a `### Q1. <question>` with 2–4 numbered options `1. **<option>** (recommended) <why, citing the work>. Cost: <cost>.`, the recommendation first, then an open `**Answer:** —` line. With no question, the section is one line: `Nothing to ask: <why>.` An answer you take alone is `**Answer:** assumed — <reason>` (`issue-cli clarify <slug> --assume`); `issue-cli clarify <slug>` shows the round and its format problems. Questions go only in this round; outside it a `question:` comment is for a blocker only.
      Write the design into the issue body under the relevant sections before checking the related boxes.
      Cite each hard decision in force for the issue (the Decisions in force block in `start`, or `issue-cli decisions --in-force <slug>`) in `## Design` by its ref, saying how the design follows it, or write `n/a <ref>: <why>`; cite a replacer, never a replaced ref.
      A criterion only the owner can check (a look, a read-through, a decision) carries the owner marker: `- [ ] The board reads well on a phone (owner)`. "(owner)" anywhere counts, and so does a box starting "Owner visual check …"; no proof ticks it, and under YOLO it waits in the review queue.
      When the issue has a `## Must not`, end each item with the criterion that fails when it is broken, `→ AC2` (several: `→ AC1, AC3`), or say why none does, `→ none: covered by the identity gate`; lint check `criteria` warns about an item with neither, or naming a box the issue doesn't have.
      Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
      Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
      When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
    # prompt_append, not prompt: a systems: overlay replaces the prompt, so only an append
    # reaches every system (docs/Workflow/proof.md#proof-after-the-install).
    prompt_append: |
      A criterion only the installed build can prove (the installed issue-cli or viewer working in every project, a number measured after the change reached agents) names its check in its text: `- [ ] AC4 Every project's lead sees the new line (after install: issue-cli check-script <slug> --yes)`; for a measure-after window add T0 = the install of main with this change, T1 = when the window ends, and what to revert on no gain. A worker never installs and the lead installs only main, so no worker can prove it before landing: at testing it is recorded with `prove --value "after install: …"`, and the lead runs the check after the install.
  - name: "backlog"
    role: "queue"
    description: "Ready to work on"
    prompt: |
      This is a handoff state.
      Tell the human in chat that this needs `in progress` approval in the issue viewer, then stop and end your turn; continue when the human messages you that it is approved.
  - name: "in progress"
    role: "work"
    description: "Actively being implemented"
    prompt: |
      Implement the accepted design and keep the issue body, implementation checklist, and test plan accurate as work progresses.
      An acceptance-criterion box ticks with `issue-cli prove`, never `issue-cli check`: `check` refuses a criterion, and the `criteria_proven` gate wants each one linked to a passing test, step or commit (`issue-cli prove <slug> --list` shows what is missing).
      Record implementation notes and planned verification steps in the issue body; checkboxes mark completion but do not replace written content.
      Declare each acceptance criterion's proof where you write it: `proves: [AC2]` on the playtest step that shows it, a `Proves: AC2 <TestName>` trailer on the commit that adds or changes the test, or `Proves: AC2` on the commit that is the change. Then, after the last code commit, post the test results: `issue-cli prove <slug> --run` runs the named tests and posts the `tests:` comment (or run them and post `issue-cli comment <slug> --text "tests: ..."`); a test trailer reads UNPROVEN until then, and a later code commit stales it. `issue-cli prove <slug> --list` shows what is proven.
      Run `issue-cli workflow catalog-check` in your worktree now, on the staged change before the first commit, and after each change to code a catalog entry lists as sources:, not first at the end of `make validate`: it checks uncommitted changes too, and each entry it names needs a version bump, or its id in one `Catalog: n/a <id>[,<id>...] <why>` line in the commit message (entry ids first); a change it names no entry for, or that only moves files unchanged, needs no Catalog: line (leave it out). It also checks the catalog itself (each entry file's category and sources, each bundled template's `features:` record in catalog order) and prints each fix; after a template change run `issue-cli workflow scan --template <name>`.
  - name: "testing"
    role: "verify"
    description: "Under verification"
    prompt: |
      Build or update the relevant automated coverage, record concrete test evidence, and surface any remaining manual checks clearly.
      Before checking test-related boxes, make sure the Test Plan section in the issue body contains the explicit automated and manual steps being verified.
      Write the manual checks as a playtest session, playtest/sessions/<name>.yaml (how: issue-cli process playtest web, docs/patterns/playtest/web-app.md): step id = the Test Plan checkbox id, a scenario from playtest/scenarios/ (add one if none fits; fixtures under tracker/, never issues/), machine checks for everything a machine can see, and expect:/do:/why: only for what needs the owner's eye. New elements a step points at get a data-testid listed in its page's file under internal/testids/.
      Run `make playtest-check`, single `make ux-test ISSUE=<slug>` runs while fixing, and `make ux-test ISSUE=<slug> REPEAT=2` once, as the final run before handing over. The runner builds the scenario: never point a session at the real projects.yaml, issues tree, user state or tmux server.
      A manual check a session can't drive (CLI commands, API routes, tmux, a terminal-only flow) comes as a guided check script: start it with `issue-cli check-script <slug> --new <name>` (scripts/checks/<name>.sh on the issue branch), read the helpers in `issue-cli check-script --lib` (sandbox_project, private_tmux, clean_shell with a stand-in claude, --touches-real for anything in the owner's real session), name the box each step proves with `--box`, and pass `issue-cli check-script <slug> --yes` before handing over. Never tick the owner's Manual boxes yourself. Its sandbox never touches the real projects.yaml, issues tree, user state or tmux server.
      A criterion that names `(after install: <command>)` is recorded, not run: `issue-cli prove <slug> <AC> --value "after install: <command>"` and `issue-cli decide <slug> --provisional --text "<AC> is checked after the install: <command>"`. The `criteria_proven` gate lists it as reported and doesn't hold testing → human-testing on it. Never ask the lead to install your branch's build to prove it (an unlanded build installed live emptied a production checkout's node_modules on 2026-11-19); the lead runs the command once main with your change is installed.
      A box that doesn't fit the change is ticked with its reason in a named form: `issue-cli check <slug> <id> --na "<reason>"`. The forms: `the repro is an automated test (<TestName>)` (a test-only fix, a bug whose repro is a go test), `no page changes` (a CLI, tmux, runner or docs change: no playtest session, no ux-test), `runner-internal, covered by <TestName>`, `covered by playtest session <name>` (the check-script box), `cli flow covered by <TestName>` (a CLI-only change a go test walks), `page state a scenario can't build (<what>), shown by <evidence>` (a page change a scenario board can't reach), or a reason in 3 words or more. Shipping boxes have no N/A: tick them plainly when done; in a repo with no git remote the move into shipping ticks the push and PR boxes itself with `no git remote` (by hand: `--na "no git remote"`). A refused N/A says `✗ not ticked:` and exits non-zero. Don't write a check script that only wraps `make validate`. An N/A never skips the owner's boxes (Human Testing, "(owner)"): they wait for the owner, or the YOLO review queue. Docs-only work is the `docs` type, with no Test Plan.
  - name: "human-testing"
    role: "owner-test"
    description: "Manual verification by humans"
    prompt: |
      Playtest sessions are your check here (playtest: agents): do not ask the human to run `make playtest`. Give them the issue page's Evidence tab (your last ux-test's shots per step) for anything that needs their eye, plus `issue-cli check-script <slug>` when the issue has a guided check script (▶ Run checks in the viewer; it ticks the boxes that passed and comments failures as `checks:`). Then ask them to approve `documentation` in the issue viewer, stop and end your turn; continue when the human messages you that it is approved.
      Make sure the manual checks are explicit, minimal, and reproducible; do not ask the human to verify against real projects or data.
      Read `playtest:` and `checks:` comments as test results: fix each failure, and answer or act on each opinion.
  - name: "documentation"
    description: "Being documented"
    prompt: |
      Update the relevant docs for the change and record the documentation work clearly.
  - name: "shipping"
    description: "Committing and merging into local main"
    prompt: |
      Ship by merging into the local main checkout. There are no pull requests (never open one) and you never push: the lead pushes main to origin when the owner asks, usually to cut a release.
      You reach shipping only after the owner has checked your work and approved documentation, so merging into local main is part of your job here: do it without asking first.
      1. Add your user-facing change summary under `## Unreleased` at the top of `cmd/issue-cli/CHANGELOG.md` (create the heading if a release just took it). Do not add a version heading or bump the version: the lead cuts releases per milestone (docs/roadmap.md). Never create or push tags.
      Commit messages are conventional commits (the commit hook rejects anything else, `wip:` and git's default merge message included): `docs(changelog): <what>`, `chore(checks): remove scripts/checks/<name>.sh`, `chore(merge): main into <slug>`.
      2. Commit on your branch (`docs(changelog): …` for step 1). Then remove your scripts/checks/<name>.sh in its own commit (`chore(checks): …`): check scripts stay on the issue branch and never reach main.
      Steps 3-4 in one command: `issue-cli ship` merges main, runs `make validate`, fast-forwards the main checkout and, when main moved meanwhile, merges again, re-checks and fast-forwards again; its last line is `ship: LANDED <sha>` (exit 0), `ship: NOT LANDED (<reason>)` (exit 1) or `ship: LANDED <sha>, check after landing FAIL (<steps>)` (exit 3: fix forward at once). Read that line, never `$?` of a pipe. `issue-cli ship --dry-run` shows the plan. The steps below are what it runs.
      3. `git merge main -m "chore(merge): main into <slug>"` (the local branch, not origin/main), resolve any conflicts, and run `make validate`. Keep both sides' entries under `## Unreleased` when the CHANGELOG conflicts. The merge's subject naming the slug is how the branch references the issue; without a merge, put a `Refs: <slug>` line in your last code commit's message before you run the tests, so nothing is amended after its tests: comment.
      Before step 4, run `issue-cli transition <slug> --to done --dry-run`: its "references the issue" line must pass (commits_reference_issue). If it fails, add the commit it shows; never reword an older commit, since Proves: trailers pin their shas.
      After merging main, check that your CHANGELOG entry still sits under `## Unreleased` and appears once: the file merges with `merge=union` (.gitattributes), so a release that renamed Unreleased can leave it under the new version heading without a conflict (`TestChangelogBranchEntriesUnreleased` in `make validate` fails then).
      4. Fast-forward the main checkout (the first path in `git worktree list`) to your branch: `git -C <main checkout> merge --ff-only <your branch>`. If it refuses because main moved, repeat step 3. If it refuses because the main checkout has uncommitted changes in files you touch, stop and tell the lead. Never force anything and never `git push`.
      After the fast-forward, local CI tests main by itself (`issue-cli ci status`). Never wait for it: if it goes red on your merge, the lead may re-open your issue.
      Before closing, post a `risk:` comment (`issue-cli comment <slug> --text "risk: ..."`) for anything to watch after the ship, or "risk: none".
      Once your commit is on local main and the Shipping boxes are ticked, move the issue to `done` yourself (`issue-cli transition <slug> --to "done"`); it needs no human approval. Polishing the GitHub release description is the human's responsibility. Leave the worktree in place: do not remove it yourself. The engine removes it once your branch is on main and your session has closed (the branch stays).
  - name: "done"
    description: "Completed"
  - name: "parked"
    description: "Blocked, deferred or won't do, with a recorded reason"
    optional: true
    global: true
    prompt: |
      This issue is parked. Don't work on it. If you were dispatched onto it, tell the human it is parked (the reason is under ## Parked Record) and end your turn.

transitions:
  - from: "idea"
    to: "in design"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Idea"
        body: |
          - [ ] Description written with enough context for someone unfamiliar
          - [ ] Edge cases and constraints identified
          - [ ] Scope is clear (what is NOT included)
      - type: "append_section"
        title: "Design"
        body: |
          - [ ] Approach documented
          - [ ] Dependencies identified
          - [ ] Overlap reviewed: similar existing features listed and the need justified
          - [ ] Discoverability: how agents find and use this is documented
          - [ ] Catalog: the entry this adds, or the entry whose version: it bumps (id, detect, sources); a `Catalog: n/a <id>[,<id>...] <why>` line for an entry catalog-check names that the change leaves as it is; no `Catalog:` line when catalog-check names no entry
          - [ ] Decisions in force cited (each hard one by ref, or n/a <ref>: <why>)
          - [ ] Human approval requested (backlog, or in progress to start straight away)
      - type: "append_section"
        title: "Acceptance Criteria"
        body: |
          - [ ] First observable requirement
          - [ ] Second observable requirement
      - type: "append_section"
        title: "Must not"
        body: |
          - <what this change must not do; a test or command in backticks when one can catch it> → AC<n>, or → none: <why>
  - from: "in design"
    to: "backlog"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Design"
      - type: "validate"
        rule: "section_has_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "criteria_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "decisions_cited: since 2026-11-01"   # issues filed before the ledger's gate don't need it
      - type: "validate"
        rule: "citations_current: since 2026-11-01"
      - type: "validate"
        rule: "decision_unchallenged: since 2026-11-01"   # held while this issue's challenge waits for the owner
      - type: "require_human_approval"
        status: "backlog"
      - type: "set_fields"
        field: "assignee"
        value: ""
  # Optional shortcut: start building straight from design, skipping the
  # backlog queue. The human approves `in progress` from `in design` instead.
  - from: "in design"
    to: "in progress"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Design"
      - type: "validate"
        rule: "section_has_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "criteria_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "decisions_cited: since 2026-11-01"   # issues filed before the ledger's gate don't need it
      - type: "validate"
        rule: "citations_current: since 2026-11-01"
      - type: "validate"
        rule: "decision_unchallenged: since 2026-11-01"   # held while this issue's challenge waits for the owner
      - type: "require_human_approval"
        status: "in progress"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Implementation"
        body: |
          - [ ] Code changes complete
          - [ ] Automated tests added or updated where practical
          - [ ] Cross-cutting impact reviewed where relevant
      - type: "append_section"
        title: "Test Plan"
        body: |
          ### Automated
          - [ ] Automated verification recorded
          
          ### Manual
          - [ ] Throwaway sandbox scenario prepared (worktree-only, gitignored e.g. under `.agent-logs/<name>-sandbox/`, never committed; isolated config/issues/state; never touches real projects.yaml, issues, or user state)
          - [ ] Manual checks that aren't playtests come as `scripts/checks/<name>.sh` (`issue-cli check-script <slug> --new <name>`), or `issue-cli check <slug> <id> --na "<reason>"`
  - from: "backlog"
    to: "in progress"
    actions:
      - type: "require_human_approval"
        status: "in progress"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Implementation"
        body: |
          - [ ] Code changes complete
          - [ ] Automated tests added or updated where practical
          - [ ] Cross-cutting impact reviewed where relevant
      - type: "append_section"
        title: "Test Plan"
        body: |
          ### Automated
          - [ ] Automated verification recorded
          
          ### Manual
          - [ ] Manual checks written as a playtest session (`playtest/sessions/<name>.yaml`, step id = checkbox id; judgement steps only for what needs the owner) and `make playtest-check` passes (or `issue-cli check <slug> <id> --na "<reason>"`)
          - [ ] Manual checks that aren't playtests come as `scripts/checks/<name>.sh` (`issue-cli check-script <slug> --new <name>`), or `issue-cli check <slug> <id> --na "<reason>"`
  - from: "in progress"
    to: "testing"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Implementation"
      - type: "validate"
        rule: "decision_unchallenged: since 2026-11-01"
      - type: "validate"
        rule: "has_test_plan"
      # Hard decisions whose paths: the branch changes are cited
      # (factory/decision-diff-audit-…); issues filed earlier pass.
      - type: "validate"
        rule: "decisions_respected: since 2026-11-01"
      - type: "append_section"
        title: "Testing"
        body: |
          - [ ] Relevant tests for changed code passing
          - [ ] Known unrelated failures documented if full suite is red
          - [ ] Test results logged as comment (`issue-cli comment <slug> --text "tests: ..."`)
          - [ ] `make ux-test ISSUE=<slug> REPEAT=2` passed, run once before handoff (or `issue-cli check <slug> <id> --na "no page changes"`)
      - type: "inject_prompt"
        prompt: |
          Run the relevant tests for the changed code, record results, and capture any remaining manual checks.
          If unrelated failures block the full suite, document them explicitly.
  - from: "testing"
    to: "human-testing"
    actions:
      - type: "validate"
        rule: "has_test_plan"
      - type: "validate"
        rule: "section_checkboxes_checked: Testing"
      - type: "validate"
        rule: "has_comment_prefix: tests:"
      # Issues created before the date are exempt (owner, D-3 of
      # workflow/issue-cli-prove-link-each-criterion-to-its-proof).
      - type: "validate"
        rule: "criteria_proven: since 2026-10-24"
        # Replaces the gate's built-in "Prove each one with any of" list.
        hint: "A criterion box ticks with issue-cli prove, never issue-cli check: issue-cli prove {{slug}} <id> --test <Name> | --step <id> | --commit <sha> | --value \"<measured>\" (a criterion only the installed build can prove: --value \"after install: <command>\"), or a `Proves: <id> <TestName>` trailer on the commit. Every link and its check: issue-cli prove {{slug}} --list"
      - type: "append_section"
        title: "Human Testing"
        body: |
          - [ ] Human verification complete if required
  - from: "human-testing"
    to: "documentation"
    actions:
      - type: "require_human_approval"
        status: "documentation"
      - type: "append_section"
        title: "Documentation"
        body: |
          - [ ] User-facing docs updated if behavior changed
          - [ ] The change adds workflow.yaml config, a validator, an action or a prompt pattern other projects should adopt, or changes what an existing one does → catalog entry added, or its version: bumped to the next release so installed projects get an update proposal (`issue-cli workflow upgrade --all` lists it), or n/a
          - [ ] Docs comment added (`issue-cli comment <slug> --text "docs: ..."`)
  - from: "documentation"
    to: "shipping"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Documentation"
      - type: "validate"
        rule: "has_comment_prefix: docs:"
      - type: "validate"
        rule: "decisions_respected: since 2026-11-01"
      - type: "append_section"
        title: "Shipping"
        body: |
          - [ ] Changes committed with a message referencing the issue: the merge commit's subject names the slug (`chore(merge): main into <slug>`), or one commit has a `Refs: <slug>` line
          - [ ] `cmd/issue-cli/CHANGELOG.md` entry added under `## Unreleased` (no version bump; the lead cuts releases per milestone)
          - [ ] Local `main` merged into the branch and `make validate` green after the merge
          - [ ] Local main fast-forwarded to the branch (`git -C <main checkout> merge --ff-only <branch>`; no push, no pull request)
          - [ ] Check scripts (scripts/checks/<name>.sh) removed in a last commit before the merge, or none
  - from: "shipping"
    to: "done"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Shipping"
      - type: "validate"
        rule: "commits_reference_issue"
  # Park from anywhere (blocked, deferred, or won't do); leave to any status.
  - from: "*"
    to: "parked"
    fields:
      - name: "parked_reason"
        prompt: "Why is it parked? (blocked on…, deferred until…, or won't do because…)"
        target: "section:Parked Record"
        type: "multiline"
        required: true

# Custom one-shot agent buttons, rendered on the issue detail view below the
# built-in Claude/Codex dispatch buttons. Each opens a tmux agent session
# briefed with the prompt below — no validation, no status change. Prompts are
# templated with {{slug}}/{{title}}/{{status}}/{{system}}/{{priority}}/{{number}}.
# (Originally named `actions:`; that key still works as a deprecated alias.)
issue_actions:
  - id: "defer-to-team"
    label: "Defer to team"
    agent: "claude"
    prompt: |
      Issue "{{title}}" ({{slug}}, status: {{status}}) is being deferred to the team.
      Draft a short, neutral handoff note that summarizes the current state, what is
      blocking progress, and the specific decision or input needed from the team.
      Then add it as a comment with: issue-cli comment {{slug}} --text "deferred: <summary>"

# What this project adds to the project lead's built-in brief (`issue-cli lead
# spawn`). The CLI adds a footer with the lead's role, authority and handoff note.
# Placeholders: {{project}} {{lead}}.
leads:
  project_addendum: |
    - In this repo: retros are in retros/ (swept into retros/archive/), worktrees in
      .worktrees/<slug>, and the board's Agents tab shows who is live.
    - Pick the type when you file an issue (create --type, or set-type at idea): report for
      research or a report only (the report goes on the shelf, no code, no commit), docs for docs
      or screenshots, bugfix, tweak, else feature. Code fixes a report finds are their own issues.
    - Bring each question with the asker's recommendation and yours.
    - After you install a build of main, run the after-install checks of the issues it landed:
      issue-cli search "after install:" lists the issues whose criteria name one, and the command
      is in the criterion. Post the result on the issue (comment --text "tests: after install of
      <version>: <AC> <pass|fail>: …"); a failed one is a bugfix issue. A measure-after window
      (T0, T1 in the criterion) is a queue item or a job due at T1, not a comment.
      Never install an unlanded branch build to prove one.

# Project-level one-shot agent buttons, rendered on the list/board/graph views
# (not bound to a single issue). Prompts template with {{project}} only.
project_actions:
  - id: "triage-backlog"
    label: "Triage backlog"
    agent: "claude"
    prompt: |
      Review every issue in the {{project}} backlog. For each, assess whether the
      design is clear enough to start and whether its priority still looks right.
      Summarize a recommended order to pick up next and flag anything blocked or
      stale, then post it with: issue-cli comment <slug> --text "triage: <note>"
  - id: "ux-review"
    label: "UX review"
    agent: "claude"
    prompt: |
      Run an ease-of-use review of {{project}} as a newcomer would meet it. Change no code.
      Look through three lenses:
        - Setup: installing, configuring, and what has to be written by hand.
        - First run: how long until the user sees the tool's value (for this tool, the first human approval).
        - Daily use: what the human repeats most, and what costs them attention.
      Also check how easily an agent can set the project up and explain it, if a user asks one.

      1. Read README.md, docs/getting-started.md, the Makefile, install.sh and the bundled templates
         under cmd/issue-cli/templates/. Note every step the docs ask for.
      2. Walk that path for real in a throwaway sandbox under .agent-logs/ux-sandbox/ (gitignored):
         a fresh `git clone` of this repo, `make build build-cli`, `make demo` on a free port, and
         `issue-cli init` / `create` in an empty folder. Use `--help` on the commands you touch, and curl
         the board pages. Never touch the real projects.yaml, the issues/ tree or user state.
      3. Record each place where a step fails, needs a file written by hand, prints an unclear message,
         or assumes something the docs don't say. Cite the evidence: the command and its output, or
         file:line. Don't count anything you didn't see.
      4. Before filing anything, check what is already tracked: `issue-cli search "<keyword>"` and
         `issue-cli list`. The adoption umbrella (`issue-cli search adoption`) and its children may
         already cover a finding.
      5. Write the report to .agent-logs/ux-review-<YYYY-MM-DD>.md. List findings ranked by impact on
         newcomers, each with its lens, evidence, a proposed fix, effort (S/M/L) and the existing issue
         it belongs to, if any. Then show the human the top five in chat.
      6. Ask the human which new findings to file. For each one they pick, run
         `issue-cli create --title "..." --system <CLI|UI|API|Workflow> --priority <p>` and write the
         body from the report. When a finding belongs under the adoption umbrella, add
         `issue-cli set-meta <slug> --key parent --value <umbrella slug>`. For findings that fit an
         existing issue, add an `issue-cli comment <slug> --text "ux: <finding and evidence>"` instead.
      7. Delete .agent-logs/ux-sandbox/ and stop any board you started.

systems:
  API:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          For API changes that affect UI-visible state, state the source of truth, whether server-side polling plus `/hash` is the expected refresh path, and whether manual browser verification is required before human-testing.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          Routes: a route you add or change gets a row in docs/API/security.md's "Route inventory", classified R/W/O/X (R reads, W writes issue or board files, O an owner decision: also in ownerOnlyRoute and owner_test.go's ownerRoutes, X starts a process); TestEveryRouteIsInTheSecurityInventory fails on a route with no row. Run `make security-check` after touching routes.go, origin.go, identity.go, headers.go, the upload code or anything that runs a command. In viewer tests newTestServer signs in as the owner by default; set the strangerHeader header to send a request without the owner's session.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/API/ with any changed endpoints, request/response formats, or behavior.
          Reference docs/API/overview.md for the current API documentation structure.
      # prompt_append, not prompt: every type that walks in progress keeps its own prompt.
      - name: "in progress"
        prompt_append: |
          API: Routes: a route you add or change gets a row in docs/API/security.md's "Route inventory", classified R/W/O/X (R reads, W writes issue or board files, O an owner decision: also in ownerOnlyRoute and owner_test.go's ownerRoutes, X starts a process); TestEveryRouteIsInTheSecurityInventory fails on a route with no row. Run `make security-check` after touching routes.go, origin.go, identity.go, headers.go, the upload code or anything that runs a command. In viewer tests newTestServer signs in as the owner by default; set the strangerHeader header to send a request without the owner's session.
    transitions:
      []
  CLI:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          Document the output contract early: whether text is human-facing or agent-facing, whether script compatibility matters, and whether `--json` or other machine-readable output is in scope for this issue.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/CLI/ with any changed commands, flags, or output formats.
          Reference docs/CLI/overview.md for the current CLI documentation structure.
      - name: "in progress"
        prompt_append: |
          CLI: a new command or subcommand joins several registries: walk "Adding a command" in docs/CLI/overview.md, then run `go test ./cmd/issue-cli -run TestEveryCommandJoinsEveryRegistry`, which names every list it is still missing from at once.
    transitions:
      []
  UI:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          For UI work that launches local tools or editors, state whether to reuse existing tmux/alacritty patterns, whether handlers may block on local processes, and what feedback the user sees after launch.
          Name the elements the issue's playtest session will point at; each gets a data-testid listed in its page's file under internal/testids/ (issue-cli process playtest web).
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          Mockups come before the written design for any change the user sees (docs/UI/overview.md, "Mockups in design"):
            1. Build them as a Claude artifact: a Design canvas with one artboard per screen, or an HTML page for a single view or a side-by-side comparison. Use real data from the project, not lorem ipsum. If the direction is unclear, ask the human what to compare before building.
            2. Link it in frontmatter: `issue-cli set-meta <slug> --key mockups --value <artifact url>`.
            3. The artifact is private, so save its sources under issues/attachments/<issue-name>/ (the .dc.html artboards or the .html page).
            4. Make screenshots with `tools/mockup-shots/shots.py issues/attachments/<issue-name>/` (Playwright; works for Design artboards and HTML pages). It captures each screen at full height and widens for boards that scroll sideways; add `--shot "<css>=<name>"` for a close-up of one region. Look at every image before using it.
            5. Under `## Mockups`, add one subsection per screen: the image (path relative to the issue file, e.g. `../attachments/<issue-name>/<screen>.png`) and a description of its layout, each region, the states and markers it shows, and what happens on interaction. Someone who cannot open the artifact must be able to build the screen from the image and the text.
          No visible change (e.g. a handler that launches a local tool): write why under `## Mockups` instead and tick its box.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/UI/ with any changed views, templates, or interaction patterns.
          Reference docs/UI/overview.md for the current UI documentation structure.
    transitions:
      - from: "idea"
        to: "in design"
        actions:
          - type: "append_section"
            title: "Mockups"
            body: |
              - [ ] Mockups published as a Claude artifact and linked in the `mockups` frontmatter field (or why none)
              - [ ] Sources saved under issues/attachments/<issue-name>/, one screenshot and description per screen below
      - from: "in design"
        to: "backlog"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Mockups"
      - from: "in design"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Mockups"
  Workflow:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant workflow and transition logic before proposing changes.
          State which statuses, rules, templates, or overlays will change, and whether existing issues need migration or compatibility handling.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/Workflow/ with any changed statuses, transitions, actions, or overlay behavior.
          Reference docs/Workflow/overview.md for the current workflow documentation structure.
    transitions:
      []
  Factory:
    # No "idea" status prompt: it would replace the bugfix and epic types'
    # idea prompts (lint). One text reaches both kinds of path: the in progress
    # append every type walks, and the idea → in design edge only features
    # pass, so a design meets the rules before it is written.
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          Follow "Settled rules" in docs/departments.md and cite the decision behind each rule the design leans on. A design that needs a rule changed says so as an open question for the owner.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "in progress"
        prompt_append: &factory_settled_rules |
          Factory: read "Settled rules" in docs/departments.md before designing or building: secrets, private projects, the waiting-on-you count, box keys, projects.yaml writes, lint checks and pilots are decided there. Don't ask again what a rule there answers; cite its decision.
          Two of them all work meets:
          - Owner acts (stamp a gate, review an output, tick an owner box, change a hard decision): a worker is refused, the lead relays the owner's words with --quote, the viewer accepts only the owner's browser (fromOwnerBrowser). Source: factory/department-outputs-shelf#D-2, api/owner-only-routes-need-an-owner-credential-on-loopback#D-2.
          - A human starts the work: workers never start agents. The one exception is an agent inside a run the human started that changes nothing by itself: the read-only one-shot critic (factory/a-fresh-critic-that-never-wrote-the-work-a-read-only-agent-given-only-paths-findings-blocksshouldnote-with-fileline-blocks-hold-the-gate#D-4) and the post-mortem at close (factory/post-mortem-actions-each-lesson-to-one-place-only-if-a-fresh-agent-would-act-differently-applied-after-the-owner-agrees#D-1).
    transitions:
      - from: "idea"
        to: "in design"
        actions:
          - type: "inject_prompt"
            prompt: *factory_settled_rules

# Types of work (docs/Workflow/types.md): an issue's `type:` picks its path.
# Unset or unknown types get default_type, so existing issues keep the full path.
default_type: feature

types:
  feature:
    description: "New behaviour: the full path through design, testing and docs"
    # no path: every base status and edge

  tweak:
    description: "A small change the human already decided (their words in the body); no design, no new behaviour"
    path: [idea, in progress, testing, shipping, done, parked]
    statuses:
      - name: "in progress"
        prompt: |
          Tweak: build exactly what the body says the human decided, nothing more. No design doc.
          If it turns out to need new behaviour or a design decision, say in chat that the type should change to feature (in the issue viewer) and end your turn.
          Catalog: run `issue-cli workflow catalog-check` on the staged change before the first commit (it checks uncommitted changes too). Each entry it names needs its version bumped (`issue-cli workflow catalog-bump <id>`), or its id in one `Catalog: n/a <id>[,<id>...] <why>` line in the commit message, entry ids first; `issue-cli workflow catalog-na <id>[,<id>...] <why>` records that line before the commit, so make validate's catalog-check is green on the uncommitted change, and the commit-msg hook writes it into the commit. A change it names no entry for, or that only moves files unchanged, needs no Catalog: line: leave it out.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Change made as decided, nothing more
              - [ ] Automated tests added or updated where practical
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Manual check listed if the change is visible (a playtest session when it shows on the board, a guided check script when it runs from a shell)
      - from: "testing"
        to: "shipping"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Testing"
          - type: "validate"
            rule: "has_comment_prefix: tests:"
          - type: "validate"
            rule: "decisions_respected: since 2026-11-01"
          - type: "require_human_approval"
            status: "shipping"
          - type: "append_section"
            title: "Shipping"
            body: |
              - [ ] Changes committed with a message referencing the issue: the merge commit's subject names the slug (`chore(merge): main into <slug>`), or one commit has a `Refs: <slug>` line
              - [ ] `cmd/issue-cli/CHANGELOG.md` entry added under `## Unreleased` (no version bump; the lead cuts releases per milestone)
              - [ ] Local `main` merged into the branch and `make validate` green after the merge
              - [ ] Local main fast-forwarded to the branch (`git -C <main checkout> merge --ff-only <branch>`; no push, no pull request)
              - [ ] Check scripts (scripts/checks/<name>.sh) removed in a last commit before the merge, or none

  docs:
    description: "Docs, README or screenshots only: no code or behaviour change, so no playtest or check script"
    path: [idea, in progress, shipping, done, parked]
    statuses:
      - name: "in progress"
        prompt: |
          Docs: change the docs, README or screenshots the body names, nothing else. There is no Test Plan: `make validate` (links, doc tests) is the check.
          If it turns out to need a code change, say in chat that the type should change to tweak or feature (in the issue viewer) and end your turn.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Docs or screenshots changed as the body says, no code
              - [ ] `make validate` green (links, doc tests)
      - from: "in progress"
        to: "shipping"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Implementation"
          - type: "validate"
            rule: "has_comment_prefix: docs:"
            hint: "issue-cli comment {{slug}} --text \"docs: <pages changed>\""
          - type: "validate"
            rule: "decisions_respected: since 2026-11-01"
          - type: "require_human_approval"
            status: "shipping"
          - type: "append_section"
            title: "Shipping"
            body: |
              - [ ] Changes committed with a message referencing the issue
              - [ ] `cmd/issue-cli/CHANGELOG.md` entry added under `## Unreleased` (no version bump; the lead cuts releases per milestone)
              - [ ] Local `main` merged into the branch and `make validate` green after the merge
              - [ ] Local main fast-forwarded to the branch (`git -C <main checkout> merge --ff-only <branch>`; no push, no pull request)

  chore:
    description: "A recurring job's housekeeping: no code, no commit, nothing for the owner to review; the brief's steps are the work"
    path: [idea, in progress, done, parked]
    statuses:
      - name: "in progress"
        prompt: |
          Chore: work through the brief's steps in order, nothing more. There is no branch to ship and no commit to make. A step that fails or holds is named in a `progress:` comment; the run still closes. If it turns out to need code or the owner's review, say so in a `question:` comment and close the run with the steps done; under YOLO that is the whole rule: no dialog, no waiting.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Chore"
            body: |
              - [ ] Every step of the brief done, or why it stopped named in a progress: comment
      - from: "in progress"
        to: "done"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Chore"
          - type: "validate"
            rule: "has_comment_prefix: progress:"

  report:
    description: "Research or report only: the report goes on the outputs shelf for the owner's review; no code, no commit"
    path: [idea, in progress, human-testing, done, parked]
    statuses:
      - name: "in progress"
        prompt: |
          Report: research what the body asks and write the report as one file (markdown is fine) anywhere outside the repo, for example your scratchpad. Nothing is built or committed on this issue, and there is no branch to ship.
          Put the report on the shelf with the issue: `issue-cli output add --issue <slug> --kind report --title "<title>" --file <report.md>` (it is copied with the work files, under <issues>/.outputs/files/, and listed on the issue's page). Re-run it with a new file if the report changes.
          Code fixes the research turns up are not built here: list each under "Follow-ups" in the report and in the `report:` comment, and file each as its own issue (`issue-cli create`, or ask the lead to). A follow-up that is the owner's call (publishing, spending, picking a channel) ends "(owner)", or goes under a sub-heading or lead-in that names the owner ("Owner actions:"): lint's reports check counts only the rest, the engine and docs work an issue or queue item has to pick up.
          If it turns out the work is a code or docs change, say in chat that the type should change to feature, tweak or docs (in the issue viewer) and end your turn.
      - name: "human-testing"
        prompt: |
          Owner review: the owner reads the report on the issue page (its shelf row) and approves or rejects it on the shelf. The Owner Review box is theirs: never tick it. Tell the human in chat that the report waits for them and that `done` needs their approval in the issue viewer, then stop and end your turn. Under YOLO the `done` gate passes and the review waits in the after-the-fact queue.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Research"
            body: |
              - [ ] The questions the report answers are listed in the body
              - [ ] Report written and on the shelf (`issue-cli output add --issue <slug> --kind report --file <report.md>`)
              - [ ] Code fixes it found filed as their own issues, or none (none built here)
      - from: "in progress"
        to: "human-testing"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Research"
          - type: "validate"
            rule: "has_output: report"
          - type: "validate"
            rule: "has_comment_prefix: report:"
            hint: "issue-cli comment {{slug}} --text \"report: <the findings in a paragraph>; follow-ups: <issues filed, or none>\""
          - type: "append_section"
            title: "Owner Review"
            body: |
              - [ ] Report read; approved or rejected on the shelf (owner)
      - from: "human-testing"
        to: "done"
        actions:
          - type: "require_human_approval"
            status: "done"

  epic:
    description: "Tracking only: groups work under one goal; children carry parent: <epic slug>, their own type and version, and ship to main as usual"
    path: [idea, in progress, done, parked]
    statuses:
      - name: "idea"
        prompt: |
          Epic: nothing is built on this issue. Its body holds the goal, the plan, the decisions that bind its children (cite them as `<slug>#D-n`) and the open questions. Children are separate issues with `parent: <this slug>` and their own type and version. The lead moves it to "in progress" when its first child starts.
      - name: "in progress"
        prompt: |
          Epic: children are built and ship to main one by one; the epic owns no branch. The lead keeps the child list current, records decisions that bind the whole area here with `issue-cli decide`, and watches progress on the Status page's Epics card. It closes when every child is done or parked ("close?" on the Epics card), on the human's approval.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
      - from: "in progress"
        to: "done"
        actions:
          - type: "validate"
            rule: "children_closed"
            values: ["done", "parked"]
          - type: "require_human_approval"
            status: "done"

  bugfix:
    description: "Something that worked is broken: a repro and a failing test first, then the fix"
    path: [idea, in progress, testing, human-testing, documentation, shipping, done, parked]
    statuses:
      - name: "idea"
        prompt: |
          A bug: write a `## Repro` section with the exact steps or test, what happens, what should happen, and since when if known.
          Then say in chat that it needs `in progress` approval in the issue viewer, and end your turn; the lead (or the human) resumes you once it is approved.
      - name: "in progress"
        prompt: |
          Bugfix: first write a test that fails on the bug, then fix it. No design doc.
          If the fix changes behaviour the design decided, say in chat that the type should change to feature (in the issue viewer) and end your turn.
          Catalog: run `issue-cli workflow catalog-check` on the staged change before the first commit (it checks uncommitted changes too). Each entry it names needs its version bumped (`issue-cli workflow catalog-bump <id>`), or its id in one `Catalog: n/a <id>[,<id>...] <why>` line in the commit message, entry ids first; `issue-cli workflow catalog-na <id>[,<id>...] <why>` records that line before the commit, so make validate's catalog-check is green on the uncommitted change, and the commit-msg hook writes it into the commit. A change it names no entry for, or that only moves files unchanged, needs no Catalog: line: leave it out.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "has_section"
            section: "Repro"
            hint: "issue-cli append {{slug}} --body \"## Repro\\n<steps>, what happens, what should happen\""
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Failing test written first
              - [ ] Fix makes it pass; no other behaviour changes
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Repro steps re-run and the bug is gone (a playtest session when it shows on the board, a guided check script when it runs from a shell) (owner)

# Where the work lives (docs/workflow.md, privacy). Work files stay in the
# private tracker; development stays in the private dev repo and the public
# repo gets one squashed commit per release.
privacy:
  work_files: tracker
  work_paths: [issues, sessions, retros, bugs, .health/snapshots]
  code: snapshots
  public_remote: public
  public_branch: main
  decided: "2026-10-24, owner in lead chat (the decisions and their words are in the private tracker)"

# What a Claude Code worker starts with (docs/agent-dispatch.md "Worker
# setup"): only these MCP servers, plugins, skills and tools, plus its
# department's connectors; leads keep the owner's whole setup. No skill and
# no Artifact, Workflow, SendFeedback, ReportFindings or ListAgents tool:
# Go-and-markdown work uses none of them. UI workers get the two
# browser servers they used so far; the playtest runner drives Chrome
# through make (chromedp), not MCP.
workers:
  mcp:
    - {server: chrome-devtools, systems: [UI], labels: [ui]}
    - {server: playwright, systems: [UI], labels: [ui]}

# Which agent CLI starts each worker, lead and job run (docs/agent-dispatch.md
# "Routing between Claude and Codex"). Owner, 2026-11-04: "Yes, I want to have
# both options available." Smaller, well-specified work goes to Codex; design,
# features, epics and leads stay on Claude. When the picked one rests after a
# usage limit, the other one starts the work.
routing:
  default: claude
  fallback: [claude]  # codex paused 2026-11-05 (see the rules below); restore [claude, codex] when the owner decides
  rules:
    - {lead: true, agent: claude}
    - {status: in design, agent: claude}
    - {type: feature, agent: claude}
    - {type: epic, agent: claude}
    - {type: tweak, agent: claude}  # codex paused 2026-11-05: its sandbox asks to approve every issue-cli and git call outside the worktree; the owner decides how codex may run
    - {type: bugfix, agent: claude}  # codex paused 2026-11-05: its sandbox asks to approve every issue-cli and git call outside the worktree; the owner decides how codex may run
    - {type: docs, agent: claude, model: claude-sonnet-5-5}  # owner 2026-11-15: docs and reports on Sonnet (the built-in default; written out here). codex paused 2026-11-05: its sandbox asks to approve every issue-cli and git call outside the worktree; the owner decides how codex may run
    - {type: report, agent: claude, model: claude-sonnet-5-5}  # owner 2026-11-15: docs and reports on Sonnet (the built-in default; written out here). codex paused 2026-11-05: its sandbox asks to approve every issue-cli and git call outside the worktree; the owner decides how codex may run
