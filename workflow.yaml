# Issue-viewer dispatches concurrent agents on different issues, so each
# session needs its own working tree to avoid stomping on uncommitted state.
worktree: true

# Red-round cap: a check (a gate's command, the proof check, a local CI
# command) still red after this many fix rounds becomes a question for the
# owner, and transition stops re-running it (issue-cli rounds <slug>).
max_red_rounds: 4

# Playtest sessions are the agents' check (make ux-test), not the owner's:
# no playtest to run on Waiting on you or the issue page (owner, 2026-10-30,
# factory/playtest-is-per-project-off-on-dark-factory D-2).
playtest: agents

# Local CI (docs/workflow.md, "Local CI"): every move of local main runs
# make validate in .worktrees/.ci and reports red to the Status page, the
# merged issues and the lead. ux-test is the slow tier, run on request:
# issue-cli ci run --tier slow.
ci:
  timeout: 20m
  run:
    - cmd: make validate
      failures: '--- FAIL: (\S+)'
      results:
        - {kind: unit, format: go-test-json, file: unit.json}
    - cmd: make ux-test
      tier: slow
      results:
        - {kind: e2e, format: playtest, file: e2e.json}

# Post-mortem at close (docs/workflow.md, "Post-mortem"): the transition into
# done starts a fresh agent that reads the run from paths only and proposes
# actions, one place each; the owner agrees or refuses them in one round
# (owner, 2026-10-31, "Yes, 1000%" on factory/post-mortem-actions-…; start:
# auto per its D-1/D-10, provisional).
postmortem:
  at: done
  start: auto

