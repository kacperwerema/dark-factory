# Department template: what `issue-cli department add marketing` installs.
# The workflow file is the bundled workflow template named in workflow:,
# written to workflows/<key>.yaml; role.md is written to
# departments/<key>/role.md. Everything else becomes the department's entry
# in projects.yaml. See docs/departments.md#templates.
name: Marketing
description: "SEO and content: refreshed pages and posts on your site(s), each reviewed by the owner before it goes out"
color: "#E2559B"
role: "SEO and content for your site(s)"
mission: "Your site(s) refreshed every week"
# Channels are types of work in the marketing workflow, each with a system
# of the same name (its room and board filter): seo-pass ↔ SEO. Add PPC,
# Social or Outreach here when you uncomment their type in
# workflows/marketing.yaml (docs/departments.md, "Channels as types").
systems: [SEO]
workflow: marketing
goals:
  - id: pages
    name: Pages refreshed
    target: 10
    period: week
  - id: posts
    name: Posts published
    target: 2
    period: week
# Recurring jobs: each run is an issue in the department (docs/departments.md,
# "Recurring jobs"). A due run waits in Needs you until the owner starts it or
# turns its standing start on: issue-cli job auto on marketing/weekly-seo-pass.
jobs:
  - id: weekly-seo-pass
    name: Weekly SEO pass
    every: week
    on: mon
    at: "07:00"
    type: seo-pass
    brief: jobs/weekly-seo-pass.md
