id: lead-prompt
version: v0.63.0
category: dispatch
propose: true
sources: ["internal/tracker/lead_brief.go", "internal/briefing/lead.go", "internal/tracker/lead.go", "cmd/issue-cli/cmd_lead.go"]
title: "Project lead brief"
what: |
  `leads.project_addendum` is what your project adds to the brief the project lead
  starts with (`issue-cli lead spawn`, one lead per project). The built-in brief says
  what the lead owns, how it routes work to workers, and that it records your answers
  with `issue-cli decide --quote` in your words. The addendum goes after it and
  templates `{{project}}` and `{{lead}}`. The CLI adds the lead's limits: answer workers
  only from recorded decisions, ask you when none covers it, dispatch only the issues
  you name (`issue-cli dispatch --quote`), tick gates only with your quote. An old
  `leads.project` still replaces the built-in brief; lint warns, because a replaced
  brief misses every later change to it. Since v0.63.0 every lead brief (the CEO's
  and each department lead's) names one way to wait: a background
  `issue-cli lead tick --watch --exit-on-news` (`--observe` for a lead that starts
  no work) and `issue-cli lead watch` for a probe, never a timed wake. Every lead brief
  also names its compact state file (`issue-cli lead state`, notes with `lead state
  note`), `issue-cli lead rotate` when the tick says its context passed 300k, and
  `issue-cli lead history <words>` to look old context up; a session started by a
  rotate gets the state file as its first prompt's handoff.
why: |
  The lead is the one session that sees every worker. An addendum tells it what you
  care about and what it may decide alone, and keeps the built-in brief current.
where: "top-level leads.project_addendum"
snippet: |
  leads:
    project_addendum: |
      - In this repo: designs live in docs/design/, and you review every diff.
      - Bring each question with the asker's recommendation and yours.
question: "What should the project lead own here, beyond the built-in brief, and what must it always bring to you?"
detect:
  - path: leads.project_addendum
  - path: leads.project
