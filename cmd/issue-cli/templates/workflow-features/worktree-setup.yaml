id: worktree-setup
version: v0.65.0
category: dispatch
propose: false
sources: ["internal/agentrun/worktree.go"]
title: "Worktree setup command"
what: |
  `worktree_setup` runs a bootstrap command (e.g. `make`) inside a newly created
  worktree; a failure aborts the dispatch. Before it, every new worktree links the
  main checkout's node_modules while its lock file is the same, so nothing is
  installed (`worktree_deps: own` gives it its own copy, a clone, instead, unless
  worktree_setup installs; `issue-cli worktree deps --own`
  gives a worktree its own copy, a clone, when its branch changes dependencies).
  No install runs through a link: an unchanged one is skipped, any other gets
  the tree's own copies first.
why: |
  Agents start in a tree that already builds, instead of each one re-discovering the
  setup steps.
where: "top-level worktree_setup: (needs worktree: true or issue-cli worktree add); worktree_deps: shared (default) or own"
snippet: |
  worktree: true
  worktree_setup: "make"
  worktree_deps: shared   # own: no links: a clone of the main checkout's
question: "Does a fresh checkout need a setup command before an agent can work in it?"
detect:
  - path: worktree_setup
