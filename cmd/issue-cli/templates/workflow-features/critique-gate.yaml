id: critique-gate
version: v0.63.0
category: gates
propose: true
sources: ["internal/critique/**", "internal/tracker/critique.go", "cmd/issue-cli/cmd_critique.go", "internal/lint/critique.go"]
title: "A fresh critic before a gate: blocks findings hold it"
what: |
  `issue-cli critique <slug>` starts a fresh, read-only agent that did not write the work
  (the other CLI than the worker's on the dispatch record; the same one when the other
  rests, which the run says), gives it only paths (the
  issue file, the branch's diff, the changed files, the settled rules), never the worker's
  summary, and tells it to assume the work is wrong. It reports findings as `blocks`,
  `should` and `note`, each with path:line, plus a Coverage line. The `critique` rule on a
  transition holds it while the newest run from the current status has a blocks finding
  (a malformed one too), failed or has no Coverage line; a new run clears it, or the owner
  overrides with their words. The in-design prompt says to answer a finding by editing
  the design in place (`issue-cli replace <slug> --section "Design"`), never by appending
  an "after critic run N" note: the critic reads the design, not its history. mem-guard
  and the CPU load are checked first; the run sits in the issue's worktree, so its tokens
  count for the issue in spend. From a status with no gate out of it the run is by hand:
  recorded and commented, it holds nothing and counts no red round. Each run records how
  long the critic took (`took_ms`); `issue-cli stats --spec-flow` and the Stats page count
  the runs and how each held gate was cleared.
why: |
  The worker that wrote the work also judges it, so its blind spots reach the owner, and
  under YOLO nobody else reads it before the after-the-fact review.
where: "a validate action with rule \"critique\" on the edge out of design and out of testing; the in design status prompt; critique: at the top level (optional)"
question: "Should a fresh read-only critic read each issue's design and finished work before the gate, with its blocks findings holding the gate?"
snippet: |
  critique:                 # optional: defaults shown
    agent: ""               # claude | codex; default: the other agent than the worker's, the same one when the other rests
    timeout: 15m
  statuses:
    - name: "in design"
      prompt: |
        A critic finding is answered by editing the design in place where it is wrong (`issue-cli replace <slug> --section "Design"`, or `--line`/`--match` for one line), never by appending an "after critic run N" note or a correction below it: the critic reads the design, not its history, and flags old and new text that contradict each other.
  transitions:
    - from: "in design"
      to: "backlog"
      actions:
        - type: "validate"
          rule: "critique"
    - from: "testing"
      to: "human-testing"
      actions:
        - type: "validate"
          rule: "critique"
detect:
  - path: transitions[].actions[].rule
    rule_in: [critique]
  - path: critique
