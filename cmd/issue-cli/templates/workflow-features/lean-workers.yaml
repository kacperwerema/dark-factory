id: lean-workers
version: v0.66.0
category: dispatch
propose: true
sources: ["internal/tracker/workers_config.go", "internal/agentrun/worker_setup.go", "internal/agentrun/worker_nice.go", "internal/tracker/leads_setup.go", "internal/agentrun/lead_setup.go", "internal/connectors/owner.go", "internal/lint/workers.go"]
title: "Workers start with only the MCP servers, plugins, skills and tools their issue needs"
what: |
  An issue's Claude Code worker starts with `--strict-mcp-config`: its department's
  connectors plus the servers `workers: mcp:` names for its system, type or label,
  copied from your own Claude Code config. Every plugin and skill you have on (personal,
  project, bundled with Claude Code, or synced from claude.ai as anthropic-skills:<name>)
  is turned off for that session (`--settings` with `enabledPlugins`, `skillOverrides`
  and `disableBundledSkills`) unless `workers: plugins:` or `skills:` keeps it for the
  issue's system, type or label; the built-in Artifact, Workflow, SendFeedback,
  ReportFindings and ListAgents tools are off unless `tools:` keeps them, and
  claude.ai connectors are off. Your own Claude Code files are never changed. Codex
  workers keep your whole setup; `setup: full` keeps it for workers too. Since v0.65.0
  leads (the CEO, department and group leads) start without the skill list and the
  Artifact, Workflow, SendFeedback and ReportFindings tools, keeping your MCP servers,
  connectors and plugins; `leads: tools:` keeps one, `leads: setup: full` gives them
  your whole setup. Since v0.66.0 `workers: nice: <0..19>` starts each worker's session
  under nice, so its tests and builds yield the cores to the lead and to what else the
  machine serves; leads stay at 0.
why: |
  Every tool name, server instruction and skill description sits in a worker's first
  turn and is read again on every turn; a worker that never opens a browser pays for
  two browser servers all the same.
where: "workers: at the top level of the workflow file (a department's own file sets its own workers)"
question: "Which of your MCP servers, plugins, skills or tools do this project's workers need, and for which systems or types?"
snippet: |
  workers:
    mcp:
      - {server: chrome-devtools, systems: [UI], labels: [ui]}
    # plugins: [frontend-design@claude-plugins-official]
    # skills:
    #   - stageshow
    #   - {skill: "anthropic-skills:pdf", types: [report]}
    # tools: [Artifact]      # or Workflow, SendFeedback, ReportFindings, ListAgents
    # nice: 10               # workers yield the cores (leads stay at 0)
    # setup: full            # the owner's whole setup, as before
  # leads:
  #   tools: [Artifact]      # a lead keeps it (Workflow, SendFeedback, ReportFindings too)
  #   setup: full            # leads get the owner's whole setup
detect:
  - path: workers
  - path: leads.tools
  - path: leads.setup
