# Bundled template stamp: which template this file came from and the
# issue-cli release that last changed it. `issue-cli workflow upgrade` compares
# it with the template bundled in the binary and proposes newer features.
# Set it to `custom` if this workflow is no longer based on a template.
template: video@v0.66.0

# Feature record: catalog features this file has (<id>@<version>) and the
# ones the human declined. Written by `issue-cli workflow scan`, read by
# `issue-cli workflow upgrade`.
features:
  installed:
    - brand-foundation@v0.61.0
    - reel-type@v0.66.0
    - report-type@v0.58.0
    - status-prompts@v0.36.0
    - types-of-work@v0.36.0
    - body-structure-gates@v0.36.0
    - checklist-gates@v0.36.0
    - comment-evidence-gates@v0.36.0
    - failure-hints@v0.36.0
    - human-approval-gates@v0.36.0
    - owner-only-gates@v0.58.0
    - publish-stamp@v0.55.0
    - checklist-sections@v0.36.0
    - board-card-fields@v0.36.0
    - board-columns@v0.36.0
    - lead-handoff-prompts@v0.36.0

# A video studio department's work, one video per issue, in two types of
# work (docs/Workflow/types.md):
#
# - studio (the default): a long explainer or demo video made by an outside
#   partner program the department drives (its partner: block in
#   projects.yaml; OpenMontage first, docs/departments.md#partners). Each
#   status is one of the partner's stages; each stage the owner reviews ends
#   in an owner_only gate, which YOLO never passes: proposal, script, scene
#   plan, assets, review and publish (docs/Workflow/yolo.md).
# - reel: a 15-60 s vertical video from a storyboard JSON filled into the
#   project's own template (the reel kit, issue-cli reel ...). Brief, script
#   and render pass without the owner; the script meets a legal check
#   (reel_legal_check, with the project's departments/<dept>/reel-legal.yaml)
#   before it renders and again before review; the owner's review is the
#   finished reel on the shelf, and the step into publish stays owner_only.
#   docs/departments.md, "Reels".
#
# Made to be a department's own file (projects.yaml departments: workflow:
# workflows/<name>.yaml): change a gate, a prompt or a type's path in your
# copy; `issue-cli workflow upgrade --department <dept>` proposes what a
# newer template adds.
board:
  columns:
    - brief
    - proposal
    - script
    - scene plan
    - assets
    - compose
    - render
    - review
    - publish
    - done
  card_fields:
    - type
    - labels
    - priority
    - assignee

statuses:
  - name: "brief"
    description: "What video, for whom, how long, where it goes"
    prompt: |
      Write the brief under ## Brief: the topic, the audience, the length, where the video will be shown, and which of the partner's pipelines fits (an explainer, a screen demo, ...).
      A video another department asked for comes as a handoff: its ## Handoff section says who asked and why.
      No spend: the department works with local models first; a paid key is used only when the owner says so on this issue.
      Then move to proposal.
  - name: "proposal"
    description: "The partner's research and concepts; the owner picks one"
    prompt: |
      Work in the partner's checkout (the role file says where and with which env). Start the partner's project for this issue (its id is the issue's partner_project:, else the slug's last part) and follow the partner's own guide for its research and proposal stages.
      Heavy tools: where mem-guard is installed, run `mem-guard check` before anything that loads a model, starts a browser or a big server, or fetches many pages, and don't start while it says BLOCKED. One local model and one browser at a time; plain fetches first.
      When the partner's proposal waits for approval, summarise the concepts, the cost estimate and the production path under ## Proposal, say in chat what the owner reviews, and end your turn. Don't wait or poll: the owner's stamp (or a `revise:` comment) resumes you.
      After the owner's stamp, record their approval at the partner as its guide says, quoting the owner's words from the issue, then go on.
  - name: "script"
    description: "The narration script; the owner approves it"
    prompt: |
      Write the script at the partner's script stage. Put it (or its path) under ## Script, with the length it reads at.
      When the partner's script stage waits for approval, say in chat what the owner reviews and end your turn. Don't wait or poll.
      After the owner's stamp, record the approval at the partner quoting the owner's words, then go on. A `revise:` comment means another pass at this stage.
  - name: "scene plan"
    description: "The scenes and the assets each needs; the owner approves them"
    prompt: |
      Make the scene plan at the partner's scene-plan stage. List the scenes and what each needs under ## Scene plan, marking anything a paid tool would make.
      When it waits for approval, say in chat what the owner reviews and end your turn. Don't wait or poll.
      After the owner's stamp, record the approval at the partner quoting the owner's words, then go on.
  - name: "assets"
    description: "Narration, images and clips made; the owner reviews them and the spend"
    prompt: |
      Make the assets at the partner's assets stage, local models first. Heavy tools: where mem-guard is installed, run `mem-guard check` before anything that loads a model, starts a browser or a big server, or fetches many pages, and don't start while it says BLOCKED. One local model and one browser at a time; plain fetches first. Free a model before loading the next.
      A paid tool runs only through the department's connector (`issue-cli connector exec <name> -- ...`), with keys from the owner's Keychain, never written to a file.
      List the assets and the spend so far under ## Assets. When the stage waits for approval, say in chat what the owner reviews and end your turn. Don't wait or poll.
      After the owner's stamp, record the approval at the partner quoting the owner's words, then go on.
  - name: "compose"
    description: "Edit and render; the render goes on the shelf"
    prompt: |
      Run the partner's edit and compose stages. Check the render (length, picture, sound: `ffprobe <file>`).
      Put the render on the shelf: `issue-cli output add --issue <slug> --title "..." --kind video --file <checkout>/projects/<id>/renders/<file>.mp4`. The shelf keeps a copy, so the video stays when the checkout is cleaned.
      Tick ## Render, then move to review.
  - name: "render"
    description: "A reel's storyboard rendered, QA green, on the shelf"
    prompt: |
      Only the reel type walks this status (its prompt is in types.reel).
  - name: "review"
    description: "Waiting for the owner's yes on the render"
    prompt: |
      Nothing is published. Say in chat where the render is on the shelf and that publishing needs `publish` approval in the issue viewer. Then end your turn. Don't wait or poll.
      If the owner asks for changes, they leave a `revise:` comment: go back to compose.
  - name: "publish"
    description: "The export bundle; the owner approves it before it goes anywhere"
    prompt: |
      Make the partner's export bundle (title, description, chapters, thumbnail) for what the owner approved, and list it under ## Published. Nothing goes outside the machine yet.
      Say in chat what the owner approves and end your turn. Don't wait or poll. After the owner's stamp, put it out where the brief says, mark it on the shelf (`issue-cli output publish <id> --url <link>`), record the link and move to done.
  - name: "done"
    description: "Out, with the link recorded"

transitions:
  - from: "brief"
    to: "proposal"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Brief"
        body: |
          - [ ] Topic, audience, length and where it is shown stated
          - [ ] The partner's pipeline named
  - from: "proposal"
    to: "brief"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "proposal"
    to: "script"
    actions:
      - type: "require_human_approval"
        status: "script"
        owner_only: true # a creative pick that commits the spend: the owner's even in YOLO
  - from: "script"
    to: "proposal"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "script"
    to: "scene plan"
    actions:
      - type: "require_human_approval"
        status: "scene plan"
        owner_only: true # the owner's review of the script: never passed by YOLO
  - from: "scene plan"
    to: "script"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "scene plan"
    to: "assets"
    actions:
      - type: "require_human_approval"
        status: "assets"
        owner_only: true # the owner's review of the scenes: never passed by YOLO
  - from: "assets"
    to: "scene plan"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "assets"
    to: "compose"
    actions:
      - type: "require_human_approval"
        status: "compose"
        owner_only: true # where paid tools spend: the owner's even in YOLO
      - type: "append_section"
        title: "Render"
        body: |
          - [ ] Render checked (length, picture, sound)
          - [ ] Render on the shelf (issue-cli output add --issue <slug> --kind video --file ...)
  - from: "compose"
    to: "review"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Render"
      - type: "validate"
        rule: "has_output: video"
  - from: "review"
    to: "compose"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "review"
    to: "publish"
    actions:
      - type: "require_human_approval"
        status: "publish"
        owner_only: true # the owner's review of the render: never passed by YOLO
      - type: "append_section"
        title: "Published"
        body: |
          - [ ] Export bundle listed and approved
          - [ ] Published: link to what went out, marked on the shelf (issue-cli output publish <id> --url <link>)
  - from: "publish"
    to: "done"
    actions:
      - type: "require_human_approval"
        status: "done"
        owner_only: true # it publishes outside the machine: the owner's even in YOLO
      - type: "validate"
        rule: "section_checkboxes_checked: Published"

# Types of work (docs/Workflow/types.md). An issue without type: is a studio
# video; issue-cli create --department <dept> --type reel makes a reel.
default_type: studio
types:
  studio:
    description: "A long explainer or demo video made with the partner program; the owner reviews every stage (6 owner_only gates)"
    path: [brief, proposal, script, scene plan, assets, compose, review, publish, done]

  # A reel: one owner review of the finished video on the shelf, plus the
  # publish stamp, which stays owner_only (reels epic D-2). No partner program:
  # the reel kit (issue-cli reel init|validate|render|qa|shelve) fills the
  # project's own template, and paid voices and clips come through the
  # department's spend-capped connectors (elevenlabs, kling).
  reel:
    description: "A 15-60 s vertical reel from a storyboard: brief, script (legal check), render, the owner's review on the shelf, publish by the owner"
    path: [brief, script, render, review, publish, done]
    statuses:
      - name: "brief"
        prompt: |
          Write the brief under ## Reel brief (issue-cli append <slug> --section "Reel brief" --body "..."): the topic and the one message, the audience, the length (15-60 s), where it goes (Instagram Reels, TikTok, Shorts), the template shape (hook plus list, before/after, app demo), the voice, and the call to action.
          Name where the reel's media come from (app recordings, the project's own clips, photos) under ## Reel brief, and copy each onto your work branch (e.g. reels/<name>/) before the storyboard names it: a gitignored media/ folder, another worktree or an unmerged branch is not a source, since the render, the QA and the next agent read only what the branch has.
          A reel another department asked for comes as a handoff: its ## Handoff section says who asked and why.
          Then move to script: it appends ## Legal check for you to fill in.
      - name: "script"
        prompt: |
          Write the script under ## Script (issue-cli append <slug> --section Script --body "..."): every spoken line and every on-screen caption, in order, with the length it reads at. The legal floor holds it, so write it that way from the start: no weight-loss or health promise unless it is an authorised claim, no first-person result ("I lost", "schudłam"): the face is a presenter, never a customer, and no other company's mark as if it endorsed the app.
          Fill in ## Legal check, one line each (issue-cli append <slug> --section "Legal check" --replace '<old line>' --body '<new line>'): music and its licence, ai_content and ai_label, face, persona and the consent file, a disclaimer when a mark is named, and a claim: line for each authorised claim with its authorisation.
          Check it: `issue-cli reel-legal <slug>` lists each finding with its fix, the same as the gate. Then move to render; the gate runs the check again and holds the reel on any finding. The phrases it looks for are the project's own: departments/<department>/reel-legal.yaml.
      - name: "render"
        prompt: |
          Make the storyboard JSON for the script and the template shape (the reel kit's schema; `issue-cli reel validate <storyboard.json>`), and name it under ## Legal check (`storyboard: <path>`): render → review checks its narration and captions too.
          Voice and paid clips come only through the department's connectors (`issue-cli connector exec <dept>/elevenlabs -- ...`, `issue-cli connector exec <dept>/kling -- ...`), which keep to the month's spend cap; real material first (app recordings, the project's own clips).
          Brand pronunciation: listen to the brand and product names in the first take of each voice before you make the rest (a TTS voice can misread a made-up name). Keep the spelling each voice says right in the project's reel config, reels/pronunciation.md, one line per voice placement (`narrator: <Brand> → <spelling>, checked on <take>`); read it before every take and put the spelling only into the TTS text, never into the captions or the script.
          Heavy tools: where mem-guard is installed, run `mem-guard check` before anything that loads a model, starts a browser or a big server, or fetches many pages, and don't start while it says BLOCKED. One local model and one browser at a time; plain fetches first. A render starts a browser (Remotion's Chrome).
          Render (`issue-cli reel render <storyboard.json> --out <mp4>`), run the QA (`issue-cli reel qa <mp4> --storyboard <storyboard.json>`) until it is green, and put it on the shelf with its QA report (`issue-cli reel shelve <mp4> --storyboard <storyboard.json> --title "..." --issue <slug>`). Tick ## Render, then move to review.
      - name: "review"
        prompt: |
          Nothing is published. Say in chat where the reel is on the shelf, that the owner approves or rejects it there (the review), and that publishing it needs `publish` approval in the issue viewer, the owner's even in YOLO. Then end your turn. Don't wait or poll.
          If the owner asks for changes, they leave a `revise:` comment (or reject it on the shelf with a note): go back to render (the picture, the voice, the timing) or to script (the words), and put the new version on the shelf (`issue-cli output revise <id> --file <mp4>`).
          Once the newest version is approved on the shelf and the owner stamped `publish`, move to publish.
          Done without publishing: a reel the owner shares privately (sends to someone, never posts) skips publish. Once the newest version is approved on the shelf and the owner stamped `done` in the issue viewer (or the lead relayed their words: `issue-cli approve <slug> --to done --quote "<the owner's words>"`), move straight to done.
      - name: "publish"
        prompt: |
          The owner approved this reel on the shelf and stamped publish. First name the route for each place the brief says it goes: `issue-cli reel routes <slug>` prints each channel, direct (a publish: connector) or through a social tool (Postiz), with its command; write them under ## Published. A channel with no route: say in chat that the owner posts it there and end your turn.
          Post it with the caption, the hashtags, the platform's AI label (when ## Legal check says ai_label: yes) and the disclaimer, exactly the approved version. Direct: `issue-cli connector exec <dept>/<name> -- publish --file <mp4> --caption-file <txt> [--ai-label]` is a dry run that says what still holds it; add --send to publish. A token error: run `-- token check` and ask the owner to refresh it; never retry with another key.
          Mark it on the shelf (`issue-cli output publish <id> --url <link>`), tick ## Published with the link and move to done.
    transitions:
      - from: "brief"
        to: "script"
        actions:
          - type: "validate"
            rule: "has_section"
            section: "Reel brief"
            hint: "write the brief first: issue-cli append {{slug}} --section \"Reel brief\" --body \"...\""
          - type: "append_section"
            title: "Legal check"
            body: |
              - music: <none, or the track and where it is from>
              - music_licence: <the licence that covers ads on Instagram and TikTok, when there is music>
              - ai_content: <yes when any person, voice or footage is AI-made, else no>
              - ai_label: <yes: the platform's AI label when it goes out, and a note on screen or in the caption>
              - face: <none, avatar or real>
              - persona: <presenter, when there is a face>
              - consent: <path to the face's written consent for commercial use, when there is a face>
              - disclaimer: <on-screen text, when the script names another company's mark>
              - claim: <phrase> = <its authorisation, one line per authorised claim>
              - storyboard: <path to the storyboard JSON, once it exists>
      - from: "script"
        to: "brief"
        actions:
          - type: "validate"
            rule: "has_comment_prefix: revise:"
      - from: "script"
        to: "render"
        actions:
          # The legal floor: no owner here, the check holds the reel.
          - type: "validate"
            rule: "reel_legal_check"
            section: "Script"
            path: "departments/{{department}}/reel-legal.yaml"
          - type: "append_section"
            title: "Render"
            body: |
              - [ ] Storyboard valid (issue-cli reel validate <storyboard.json>) and named under ## Legal check (storyboard:)
              - [ ] Rendered (issue-cli reel render <storyboard.json> --out <mp4>)
              - [ ] QA green (issue-cli reel qa <mp4> --storyboard <storyboard.json>)
              - [ ] On the shelf with its QA report (issue-cli reel shelve <mp4> --storyboard <storyboard.json> --title "..." --issue <slug>)
      - from: "render"
        to: "script"
        actions:
          - type: "validate"
            rule: "has_comment_prefix: revise:"
      - from: "render"
        to: "review"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Render"
          - type: "validate"
            rule: "has_output: video"
          # Again, now with the storyboard's narration and captions.
          - type: "validate"
            rule: "reel_legal_check"
            section: "Script"
            path: "departments/{{department}}/reel-legal.yaml"
      - from: "review"
        to: "render"
        actions:
          - type: "validate"
            rule: "has_comment_prefix: revise:"
      - from: "review"
        to: "script"
        actions:
          - type: "validate"
            rule: "has_comment_prefix: revise:"
      # The owner's two acts, both before anything goes out: the review (the
      # newest version approved on the shelf) and the publish stamp, which
      # YOLO never passes. publish → done then needs no third stamp.
      - from: "review"
        to: "publish"
        replace: true
        actions:
          - type: "validate"
            rule: "outputs_approved: video"
            hint: "the owner approves the newest version on the shelf first (/p/<project>/shelf, or issue-cli outputs --issue {{slug}})"
          - type: "require_human_approval"
            status: "publish"
            owner_only: true # it publishes outside the machine: the owner's even in YOLO
          - type: "append_section"
            title: "Published"
            body: |
              - [ ] Route named for each channel (issue-cli reel routes <slug>): direct or Postiz
              - [ ] Caption, hashtags, the AI label and the disclaimer ready, as ## Legal check says
              - [ ] Published: link to what went out, marked on the shelf (issue-cli output publish <id> --url <link>)
      # Done without publishing: a reel the owner shares privately. The same
      # shelf approval, and the owner's own words for done (approval: comment).
      - from: "review"
        to: "done"
        actions:
          - type: "validate"
            rule: "outputs_approved: video"
            hint: "the owner approves the newest version on the shelf first (/p/<project>/shelf, or issue-cli outputs --issue {{slug}})"
          - type: "require_human_approval"
            status: "done"
            owner_only: true # done without publishing is the owner's word, even in YOLO
      - from: "publish"
        to: "done"
        replace: true
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Published"
