  installed:
    - brand-foundation@v0.61.0
    - cms-publish@v0.64.0
    - competitor-scan@v0.63.0
    - keyword-research@v0.61.0
    - measure-after-publish@v0.58.0
    - page-rules@v0.65.0
    - report-type@v0.66.0
    - seo-baseline@v0.61.0
    - social-channel@v0.61.0
    - status-prompts@v0.36.0
    - types-of-work@v0.36.0
    - workflow-evals@v0.61.0
